name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (PyQt6/EGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 \
            libxcb-xinerama0 libxcb-cursor0 libdbus-1-3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hedge_fund/requirements.txt

      - name: Bootstrap ML models
        run: python -m hedge_fund.scripts.bootstrap_models

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest hedge_fund/tests/ -q --tb=short
